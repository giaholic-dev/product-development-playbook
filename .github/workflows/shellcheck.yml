name: ShellCheck

on:
  pull_request:
    paths:
      - "**.sh"
      - "scripts/**/*.jq"
      - "scripts/fixtures/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  push:
    branches:
      - main
    paths:
      - "**.sh"
      - "scripts/**/*.jq"
      - "scripts/fixtures/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt jq
      - name: Lint shell scripts
        run: shellcheck --shell=bash --severity=warning scripts/*.sh
      - name: Validate exporter and regression fixtures
        run: bash scripts/check-export-audit.sh
