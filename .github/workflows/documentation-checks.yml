name: Documentation checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-documentation.py'
      - 'scripts/test_check_documentation.py'
      - '.github/workflows/documentation-checks.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-documentation.py'
      - 'scripts/test_check_documentation.py'
      - '.github/workflows/documentation-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise failure and example cases
        run: python3 -m unittest discover -s scripts -p test_check_documentation.py
      - name: Check documentation links and headings
        run: python3 scripts/check-documentation.py
